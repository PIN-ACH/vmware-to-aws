# Ansible configuration for the VMware-to-AWS re-platform engine.
# Keeps the demo self-contained and non-interactive.
[defaults]
inventory = inventory.ini
roles_path = roles
host_key_checking = False
retry_files_enabled = False
stdout_callback = yaml
interpreter_python = auto_silent

[ssh_connection]
# Migrated instances live in private subnets; add a bastion/SSM ProxyCommand
# here if not using public IPs. Pipelining speeds up runs.
pipelining = True
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o StrictHostKeyChecking=no

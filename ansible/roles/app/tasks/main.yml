---
# App tier: a minimal systemd-managed demo API on port 8080, implemented with
# plain Python 3 (no external deps) so the role works on any Linux without a
# package-manager dance. Proves the app tier is reachable from the web tier.

- name: Ensure python3 is present (Debian/Ubuntu)
  ansible.builtin.apt:
    name: python3
    state: present
  when: ansible_os_family == "Debian"

- name: Ensure python3 is present (RedHat/RHEL)
  ansible.builtin.dnf:
    name: python3
    state: present
  when: ansible_os_family == "RedHat"

- name: Deploy demo API
  ansible.builtin.copy:
    dest: /opt/demo-api.py
    mode: "0755"
    content: |
      #!/usr/bin/env python3
      from http.server import BaseHTTPRequestHandler, HTTPServer
      import socket, json

      class H(BaseHTTPRequestHandler):
          def do_GET(self):
              self.send_response(200)
              self.send_header("Content-Type", "application/json")
              self.end_headers()
              body = {"service": "demo-api", "host": socket.gethostname(), "status": "ok"}
              self.wfile.write(json.dumps(body).encode())
          def log_message(self, *a):  # quiet
              pass

      if __name__ == "__main__":
          HTTPServer(("0.0.0.0", 8080), H).serve_forever()

- name: Install systemd unit for demo API
  ansible.builtin.copy:
    dest: /etc/systemd/system/demo-api.service
    mode: "0644"
    content: |
      [Unit]
      Description=Demo API (re-platformed app tier)
      After=network.target

      [Service]
      ExecStart=/usr/bin/env python3 /opt/demo-api.py
      Restart=always

      [Install]
      WantedBy=multi-user.target

- name: Enable and start demo API
  ansible.builtin.systemd:
    name: demo-api
    state: started
    enabled: true
    daemon_reload: true
